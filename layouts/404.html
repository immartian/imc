
{{ define "main" }}
  <main id="main">
    <h1>Page Not Found - Check the Internet Archive</h1>
    <p>The page you were looking for might be available on the Internet Archive.</p>
    
    <p>Try this link:</p>
    <a id="archive-link" href="#">Loading...</a>
    
    <script>
        // Get the original URL the user tried to access
        var missingPageUrl = window.location.href;
        var archiveLink = "https://web.archive.org/web/*/" + missingPageUrl;
    
        // Set the correct archive.org link
        document.getElementById("archive-link").href = archiveLink;
        document.getElementById("archive-link").textContent = archiveLink;
    </script>
  </main>
{{ end }}
