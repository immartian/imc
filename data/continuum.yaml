# The continuum: RE's layers as drawn on isaacmao.com, inner to outer.
# Read by tools/make_continuum.py (the rings and the mini maps) and by the
# continuum-layers shortcode (the cards on /continuum/).
#
#   ring:     label drawn on the ring
#   who:      a few thinkers drawn on the ring (the full lineage is on the card)
#   note:     optional italic note after the thinkers
#   read_by:  id of the layer whose reflection reaches this one (itself = a loop)
#   title, re, door_label, remembers, door, looking_back, lineage: the card.
#   Card text is Markdown; {ch4}, {M}, {P} ... become links to the RE thesis.

